name: Bug report
description: Report a reproducible defect in the V2 vulnerability-research extension
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private target source, private CodeQL databases or undisclosed vulnerability details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options:
        - Contracts
        - Core workflow/state
        - CodeQL runner or LSP
        - Pi integration
        - CLI integration
        - Build/test/package infrastructure
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal sanitized inputs, commands and the run phase where it failed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Structured diagnostics
      description: Include sanitized error codes, verification level and relevant artifact paths. Do not paste secrets.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, CodeQL version and host Agent/Harness version when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private source and undisclosed vulnerability details.
          required: true
