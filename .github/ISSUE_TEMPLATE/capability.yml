name: Capability proposal
description: Propose a vulnerability-research capability, analyzer or host integration
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: Which vulnerability-research task cannot be completed reliably today?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Proposed category
      options:
        - Domain contract
        - Core workflow or evidence
        - Analyzer/runner
        - Pi integration
        - DeepSeek Harness integration
        - MCP or CLI integration
        - Evaluation/Golden infrastructure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Expected evidence and success gate
      description: How will the system prove the capability works without trusting model text?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Host boundary
      description: Explain why this belongs in the vulnerability-research extension rather than the host Agent/Harness.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Contracts and compatibility
      description: Note affected schemas, artifacts, integrations and replay behavior.
